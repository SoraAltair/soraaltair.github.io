<!DOCTYPE html>
<html>
<head>
    <title>I'm lazy, screw off.</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: white;
            color: black;
        }
        div {
            text-align: center;
        }
        .main-text {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .sub-text {
            font-size: 14px;
            font-weight: normal;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .subber-text {
            font-size: 8px;
            font-weight: normal;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>
    <div>
        <div class="main-text">I'm too lazy to program this, and it's too complicated for my poor ADHD brain&mdash;just play the music yourself.</div>
        <div class="sub-text">(I guess I can at least redirect you to Spotify while I'm here.)</div>
        <div class = "subber-text"><br>(... loser.)</div>
    </div>
    <script>
        // Show subtext after 3 seconds
        setTimeout(function() {
            document.querySelector('.sub-text').style.opacity = '1';
        }, 2000);
        setTimeout(function() {
            document.querySelector('.subber-text').style.opacity = '1';
        }, 4000);
        
        // Redirect after 5 seconds
        setTimeout(function() {
            window.location.href = "https://open.spotify.com/";
        }, 6000);
    </script>
</body>
</html>
