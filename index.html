<!DOCTYPE html>
<html>
<head>
    <title>Hello, fellow losers.</title>
    <link rel="icon" type="image/x-icon" href = "Absolute ICON.png">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: white;
            color: black;
        }
        div {
            text-align: center;
        }
        .main-text {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .sub-text {
            font-size: 14px;
            font-weight: normal;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .subber-text {
            font-size: 8px;
            font-weight: normal;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>
    <div>
        <div class="main-text">There's nothing here yet!</div>
    </div>
    <script>
        // Show subtext after 3 seconds
        setTimeout(function() {
            document.querySelector('.sub-text').style.opacity = '1';
        }, 2000);
        setTimeout(function() {
            document.querySelector('.subber-text').style.opacity = '1';
        }, 4000);
</body>
</html>
